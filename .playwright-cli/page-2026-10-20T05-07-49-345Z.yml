    - region [ref=f1e153]:
      - article [ref=f1e154]:
        - heading "How to count the drawer" [level=2] [ref=f1e155]
        - paragraph [ref=f1e156]: The cash drawer calculator on this page adds up the bills and coins in your register at the end of a shift. You type how many of each you have. The tool does the maths, shows the total, and tells you how much to deposit. It also shows which bills to pull so the float stays in the drawer.
        - heading "Count the drawer in six steps" [level=2] [ref=f1e157]
        - list [ref=f1e158]:
          - listitem [ref=f1e159]: Close the sale screen so no new sales come in while you count.
          - listitem [ref=f1e160]: Take all cash out of the drawer, including the bills under the tray.
          - listitem [ref=f1e161]: Sort it by type. Face all bills the same way and put the largest on top.
          - listitem [ref=f1e162]: Count each type once and enter the number in its row. Start with the $100 bills and work down to the pennies.
          - listitem [ref=f1e163]: Enter your starting float. The tool shows the cash to deposit.
          - listitem [ref=f1e164]: Enter the expected sales from your register report. The tool shows if you are over or short.
        - paragraph [ref=f1e165]: Press Enter after each row to jump to the next one. On a phone, the number keypad opens by itself.
        - heading "What is a float?" [level=2] [ref=f1e166]
        - paragraph [ref=f1e167]: A float is the cash you leave in the drawer so the next shift can make change. It is also called a bank, a till float, or a starting bank. Many shops use $100 to $300. The float is not sales money. You count it, then you leave it.
        - paragraph [ref=f1e168]: Your deposit is the total in the drawer minus the float. If you count $1,250.00 and the float is $200.00, you deposit $1,050.00.
        - heading "How the pull list works" [level=2] [ref=f1e169]
        - paragraph [ref=f1e170]: The tool picks the float first. It starts with the largest bills up to $20 and works down, then uses coins and rolls for the rest. It never leaves $100 or $50 bills in the drawer. Everything else goes in the deposit. If your cash cannot make the float exactly, the tool says how much is missing, so you can swap bills by hand.
        - heading "Tips to avoid counting errors" [level=2] [ref=f1e171]
        - list [ref=f1e172]:
          - listitem [ref=f1e173]: Count twice if the drawer is off by more than a few dollars. Count a different way the second time, for example by stack size.
          - listitem [ref=f1e174]: Count coins in rolls or stacks of ten. Do not count them one by one.
          - listitem [ref=f1e175]: Check for stuck bills. Two bills can stick together, especially when new.
          - listitem [ref=f1e176]: Do not mix checks, gift cards or coupons with cash. Count them apart.
          - listitem [ref=f1e177]: Enter the expected sales from the same time you stopped sales. A late sale causes a false shortage.
          - listitem [ref=f1e178]: Have a second person watch or sign the count if your shop has a rule for it.
        - heading "Worked example" [level=2] [ref=f1e179]
        - paragraph [ref=f1e180]: "A cafe closes with this cash in the drawer: 2 $100 bills, 3 $50 bills, 20 $20 bills, 15 $10 bills, 30 $5 bills, 40 $1 bills, 20 quarters, 15 dimes, 10 nickels and 25 pennies."
        - list [ref=f1e181]:
          - listitem [ref=f1e182]: Bills add up to $1,090.00. Coins add up to $7.25. The total in the drawer is $1,097.25.
          - listitem [ref=f1e183]: The float is $200.00. The tool leaves ten $20 bills in the drawer.
          - listitem [ref=f1e184]: Cash to deposit is $897.25. You pull the $100 bills, the $50 bills, ten $20 bills, all $10 and $5 bills, the $1 bills and the coins.
          - listitem [ref=f1e185]: Expected sales from the register report are $890.00. The drawer is over by $7.25.
