        - heading "Over and short" [level=2] [ref=f1e211]
        - paragraph [ref=f1e212]: Over means you have more cash than the register says. Short means less. A small difference is common, often from wrong change. A large or repeated difference needs a check of voids, refunds, tips, and paid-outs. This tool uses your total minus the float, then compares it to expected sales.
        - heading "Who uses a drawer count" [level=2] [ref=f1e213]
        - paragraph [ref=f1e214]: Cashiers count at the end of every shift. Shift leads count when one cashier hands the drawer to the next. Owners of small shops and food trucks count to match the cash against the sales report before the bank run. The steps are the same for each of them, so one calculator fits all three.
        - heading "Private and fast" [level=2] [ref=f1e215]
        - paragraph [ref=f1e216]: Everything runs in your browser. Your counts are not sent anywhere. The tool saves only your last float on your own device, so you do not need to type it every night. Use the Print button for a clean sheet, or Copy summary to paste it into an email or a text.
